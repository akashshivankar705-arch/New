<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knock Knock!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .card-container {
      background: #161b22;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 480px;
      width: 90%;
      border: 1px solid #30363d;
    }

    .video-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000000;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    .input-section {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
    }

    .input-section.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background-color: #0d1117;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #58a6ff;
    }

    input[type="text"]::placeholder {
      color: #8b949e;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background-color: #238636;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #2ea043;
    }

    .error-text {
      color: #f85149;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="video-wrapper">
      <video id="knockVideo" autoplay muted playsinline>
        <source src="1000151112.mp4" type="video/mp4">
        Your browser does not support video playback.
      </video>
    </div>

    <!-- Input bar section revealed when video finishes -->
    <div id="interactiveBar" class="input-section">
      <div class="input-group">
        <input type="text" id="nameInput" placeholder="your name" autocomplete="off">
        <button onclick="submitAnswer()">Enter</button>
      </div>
      <div id="errorMessage" class="error-text"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('knockVideo');
    const interactiveBar = document.getElementById('interactiveBar');
    const nameInput = document.getElementById('nameInput');
    const errorMessage = document.getElementById('errorMessage');

    // Reveal input bar when video ends
    video.addEventListener('ended', () => {
      interactiveBar.classList.add('visible');
      nameInput.focus();
    });

    // Handle Enter key press
    nameInput.addEventListener('keypress', (event) => {
      if (event.key === 'Enter') {
        submitAnswer();
      }
    });

    function submitAnswer() {
      const enteredName = nameInput.value.trim();

      if (enteredName === "") {
        errorMessage.textContent = "Please enter a name!";
        return;
      }

      // Save entered name for Page 2
      localStorage.setItem('friendName', enteredName);

      // Redirect to Page 2
      window.location.href = "page2.html"; 
    }
  </script>

</body>
</html>
